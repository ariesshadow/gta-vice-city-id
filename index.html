<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vice City Customs // ID Generator</title>
  <style>
    body { background-color: #0a0a12; color: #fff; font-family: 'Segoe UI', Roboto, sans-serif; padding: 24px; margin: 0; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ff007f; padding-bottom: 16px; margin-bottom: 24px; }
    h1 { margin: 0; color: #ff007f; text-shadow: 0 0 12px #ff007f; letter-spacing: 2px; }
    .btn { background: #ff007f; color: #fff; padding: 10px 18px; font-weight: bold; border-radius: 4px; cursor: pointer; border: none; font-size: 14px; }
    .btn-export { background: #00f0ff; color: #000; }
    .grid { display: grid; grid-template-columns: 320px 1fr; gap: 24px; }
    .card { background: #121224; padding: 20px; border-radius: 8px; border: 1px solid #00f0ff; box-shadow: 0 0 15px rgba(0,240,255,0.1); }
    input[type="text"] { width: 100%; padding: 8px; margin: 4px 0 14px 0; background: #0a0a12; border: 1px solid #ff007f; color: #fff; border-radius: 4px; box-sizing: border-box; }
    canvas { width: 100%; height: auto; display: block; border-radius: 6px; border: 1px solid #ff007f; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>VICE CITY CUSTOMS</h1>
      <p style="color: #00f0ff; margin: 4px 0 0 0; font-size: 13px; letter-spacing: 2px;">// OFFICIAL CRIMINAL RECORD & ID BADGE GENERATOR</p>
    </div>
    <div style="display: flex; gap: 12px;">
      <label class="btn">📷 UPLOAD PHOTO <input type="file" id="upload" accept="image/*" style="display:none"></label>
      <button class="btn btn-export" onclick="exportImage()">💾 EXPORT ID BADGE</button>
    </div>
  </header>

  <div class="grid">
    <div class="card">
      <h3 style="color: #ff007f; margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 8px;">ID BADGE DETAILS</h3>
      <label style="font-size: 12px; color: #00f0ff;">NAME / ALIAS</label>
      <input type="text" id="name" value="TOMMY VERCETTI">
      
      <label style="font-size: 12px; color: #00f0ff;">PRIMARY OFFENSE</label>
      <input type="text" id="crime" value="GRAND THEFT AUTO">
      
      <label style="font-size: 12px; color: #00f0ff;">BOUNTY AMOUNT</label>
      <input type="text" id="bounty" value="$50,000">

      <h3 style="color: #ff007f; border-top: 1px solid #333; padding-top: 12px;">IMAGE ADJUSTMENTS</h3>
      <label style="font-size: 12px; color: #00f0ff;">BRIGHTNESS</label>
      <input type="range" id="brightness" min="50" max="150" value="100" style="width: 100%; margin-bottom: 10px;">
      
      <label style="font-size: 12px; color: #00f0ff;">SATURATION (NEON)</label>
      <input type="range" id="saturate" min="0" max="200" value="100" style="width: 100%; margin-bottom: 10px;">
      
      <label style="font-size: 12px; color: #00f0ff;">OVERLAY STAMP</label>
      <input type="text" id="stamp" value="WANTED">
    </div>

    <div class="card" style="border-color: #ff007f;">
      <canvas id="canvas"></canvas>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let loadedImage = null;

    canvas.width = 900;
    canvas.height = 550;

    function render() {
      // 1. Badge Background
      ctx.fillStyle = '#10101e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Outer Neon Frame Border
      ctx.strokeStyle = '#ff007f';
      ctx.lineWidth = 8;
      ctx.strokeRect(4, 4, canvas.width - 8, canvas.height - 8);

      ctx.strokeStyle = '#00f0ff';
      ctx.lineWidth = 2;
      ctx.strokeRect(12, 12, canvas.width - 24, canvas.height - 24);

      // 2. Header Banner
      ctx.fillStyle = '#ff007f';
      ctx.fillRect(20, 20, canvas.width - 40, 70);

      ctx.fillStyle = '#ffffff';
      ctx.font = '900 28px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('VICE CITY POLICE DEPARTMENT', 40, 62);

      ctx.fillStyle = '#00f0ff';
      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText('PERMIT #VC-86049', canvas.width - 40, 62);

      // 3. Photo Container Box (Left side of Card)
      const photoX = 40;
      const photoY = 110;
      const photoW = 340;
      const photoH = 390;

      ctx.fillStyle = '#05050a';
      ctx.fillRect(photoX, photoY, photoW, photoH);
      ctx.strokeStyle = '#00f0ff';
      ctx.lineWidth = 2;
      ctx.strokeRect(photoX, photoY, photoW, photoH);

      if (loadedImage) {
        ctx.save();
        // Crop photo to fit inside photo box cleanly
        ctx.beginPath();
        ctx.rect(photoX, photoY, photoW, photoH);
        ctx.clip();

        const b = document.getElementById('brightness').value;
        const s = document.getElementById('saturate').value;
        ctx.filter = `brightness(${b}%) saturate(${s}%)`;

        // Scale & Center Image in Photo Box
        const scale = Math.max(photoW / loadedImage.width, photoH / loadedImage.height);
        const x = photoX + (photoW - loadedImage.width * scale) / 2;
        const y = photoY + (photoH - loadedImage.height * scale) / 2;
        ctx.drawImage(loadedImage, x, y, loadedImage.width * scale, loadedImage.height * scale);
        ctx.restore();
      } else {
        ctx.fillStyle = '#00f0ff';
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('📷 UPLOAD PORTRAIT PHOTO', photoX + photoW / 2, photoY + photoH / 2);
      }

      // 4. Right Side: Badge Information Text
      const infoX = 410;

      ctx.textAlign = 'left';
      ctx.fillStyle = '#00f0ff';
      ctx.font = 'bold 14px sans-serif';
      ctx.fillText('SUBJECT ALIAS', infoX, 135);

      ctx.fillStyle = '#ffffff';
      ctx.font = '900 32px sans-serif';
      const nameVal = document.getElementById('name').value.toUpperCase();
      ctx.fillText(nameVal || 'UNKNOWN', infoX, 172);

      ctx.fillStyle = '#00f0ff';
      ctx.font = 'bold 14px sans-serif';
      ctx.fillText('PRIMARY OFFENSE', infoX, 220);

      ctx.fillStyle = '#ff007f';
      ctx.font = 'bold 22px sans-serif';
      const crimeVal = document.getElementById('crime').value.toUpperCase();
      ctx.fillText(crimeVal || 'NONE', infoX, 252);

      ctx.fillStyle = '#00f0ff';
      ctx.font = 'bold 14px sans-serif';
      ctx.fillText('BOUNTY OFFERED', infoX, 300);

      ctx.fillStyle = '#ffd700';
      ctx.font = '900 36px sans-serif';
      const bountyVal = document.getElementById('bounty').value.toUpperCase();
      ctx.fillText(bountyVal || '$0', infoX, 342);

      // 5. Decorative Barcode at Bottom Right
      ctx.fillStyle = '#ffffff';
      for (let i = 0; i < 30; i++) {
        const barWidth = (i % 3 === 0) ? 5 : 2;
        ctx.fillRect(infoX + (i * 12), 430, barWidth, 40);
      }
      ctx.font = '12px monospace';
      ctx.fillStyle = '#888888';
      ctx.fillText('VCPD-SECURITY-CLEARANCE-LEVEL-4', infoX, 488);

      // 6. Overlay Stamp (Angled text across the photo)
      const stamp = document.getElementById('stamp').value;
      if (stamp) {
        ctx.save();
        ctx.translate(photoX + photoW / 2, photoY + photoH / 2 + 80);
        ctx.rotate(-18 * Math.PI / 180);

        ctx.strokeStyle = '#ff007f';
        ctx.lineWidth = 4;
        ctx.strokeRect(-130, -35, 260, 60);

        ctx.fillStyle = '#ff007f';
        ctx.font = '900 36px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(stamp.toUpperCase(), 0, 8);
        ctx.restore();
      }
    }

    document.getElementById('upload').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const img = new Image();
        img.onload = () => { loadedImage = img; render(); };
        img.src = URL.createObjectURL(file);
      }
    });

    ['name', 'crime', 'bounty', 'brightness', 'saturate', 'stamp'].forEach(id => {
      document.getElementById(id).addEventListener('input', render);
    });

    function exportImage() {
      const link = document.createElement('a');
      link.download = `${document.getElementById('name').value.toLowerCase().replace(/\s+/g, '-')}-vice-id.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    render();
  </script>
</body>
</html>
